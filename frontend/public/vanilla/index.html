<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balance Score Card Portal</title>
    <link rel="stylesheet" href="./shared/styles.css" />
  </head>
  <body>
    <div class="login-page">
      <nav class="app-navbar">
        <div class="app-navbar__brand" aria-label="Maruti Suzuki">
          <img class="app-navbar__brand-mark" src="./assets/maruti-logoo.png" alt="Maruti Suzuki" />
        </div>

        <div class="app-navbar__right">
          <img class="app-navbar__powered-logo" src="./assets/Powered_By_DE_black.png" alt="Powered by DE" />

          <button class="app-navbar__icon-btn" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>

          <button class="app-navbar__icon-btn" type="button" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="5" r="1" fill="currentColor"></circle>
              <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
              <circle cx="12" cy="19" r="1" fill="currentColor"></circle>
            </svg>
          </button>

          <div class="app-navbar__user">
            <div class="app-navbar__avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"></path>
              </svg>
            </div>
            <div class="app-navbar__user-info">
              <span class="app-navbar__user-name">Please login</span>
              <span class="app-navbar__user-code">Select your role</span>
            </div>
          </div>
        </div>
      </nav>

      <main class="login-content">
        <section class="login-illustration" aria-hidden="true">
          <div class="illustration-wrapper">
            <div class="float-elem float-clock">
              <svg viewBox="0 0 60 60" fill="none">
                <circle cx="30" cy="30" r="28" fill="#7C83FD" stroke="white" stroke-width="2"></circle>
                <path d="M30 16v14l8 8" stroke="white" stroke-width="3" stroke-linecap="round"></path>
              </svg>
            </div>

            <div class="float-elem float-doc1">
              <svg viewBox="0 0 50 60" fill="none">
                <rect x="4" y="4" width="42" height="52" rx="4" fill="#e8eaff" stroke="#7C83FD" stroke-width="1.5"></rect>
                <rect x="10" y="16" width="22" height="3" rx="1.5" fill="#7C83FD" opacity="0.6"></rect>
                <rect x="10" y="23" width="30" height="3" rx="1.5" fill="#7C83FD" opacity="0.4"></rect>
                <rect x="10" y="30" width="26" height="3" rx="1.5" fill="#7C83FD" opacity="0.4"></rect>
                <path d="M10 10 L14 6" stroke="#7C83FD" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </div>

            <div class="float-elem float-user1">
              <svg viewBox="0 0 60 60" fill="none">
                <circle cx="30" cy="30" r="28" fill="#4F46E5"></circle>
                <circle cx="30" cy="22" r="10" fill="white" opacity="0.9"></circle>
                <path d="M10 50c0-11 9-18 20-18s20 7 20 18" fill="white" opacity="0.9"></path>
              </svg>
            </div>

            <div class="float-elem float-wave">
              <svg viewBox="0 0 80 50" fill="none">
                <rect x="2" y="2" width="76" height="46" rx="12" fill="#e8eaff" stroke="#7C83FD" stroke-width="1.5"></rect>
                <path d="M16 20 Q40 14 64 20" stroke="#7C83FD" stroke-width="2.5" stroke-linecap="round"></path>
                <path d="M20 30 Q40 24 60 30" stroke="#7C83FD" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </div>

            <div class="float-elem float-chat">
              <svg viewBox="0 0 80 55" fill="none">
                <rect x="2" y="2" width="76" height="44" rx="12" fill="#2563EB"></rect>
                <circle cx="24" cy="24" r="5" fill="white"></circle>
                <circle cx="40" cy="24" r="5" fill="white"></circle>
                <circle cx="56" cy="24" r="5" fill="white"></circle>
                <path d="M20 46 L12 55 L32 46" fill="#2563EB"></path>
              </svg>
            </div>

            <div class="float-elem float-checklist">
              <svg viewBox="0 0 120 100" fill="none">
                <rect x="2" y="2" width="116" height="96" rx="12" fill="#c7d2fe" opacity="0.8"></rect>
                <rect x="14" y="16" width="16" height="16" rx="4" fill="#4F46E5"></rect>
                <polyline points="17,24 21,28 28,18" stroke="white" stroke-width="2.5" stroke-linecap="round"></polyline>
                <rect x="36" y="18" width="68" height="4" rx="2" fill="#6366f1" opacity="0.5"></rect>
                <rect x="36" y="26" width="50" height="4" rx="2" fill="#6366f1" opacity="0.3"></rect>
                <rect x="14" y="44" width="16" height="16" rx="4" fill="#4F46E5" opacity="0.7"></rect>
                <polyline points="17,52 21,56 28,46" stroke="white" stroke-width="2.5" stroke-linecap="round"></polyline>
                <rect x="36" y="46" width="68" height="4" rx="2" fill="#6366f1" opacity="0.5"></rect>
                <rect x="36" y="54" width="50" height="4" rx="2" fill="#6366f1" opacity="0.3"></rect>
                <circle cx="100" cy="76" r="14" fill="#4F46E5"></circle>
                <circle cx="100" cy="70" r="5" fill="white" opacity="0.9"></circle>
                <path d="M90 84c0-5.5 4.5-9 10-9s10 3.5 10 9" fill="white" opacity="0.9"></path>
              </svg>
            </div>

            <div class="float-elem float-terminal">
              <svg viewBox="0 0 100 70" fill="none">
                <rect x="2" y="2" width="96" height="66" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"></rect>
                <rect x="10" y="18" width="60" height="10" rx="4" fill="#3b82f6" opacity="0.3"></rect>
                <rect x="10" y="34" width="50" height="10" rx="4" fill="#3b82f6" opacity="0.2"></rect>
                <rect x="10" y="50" width="70" height="10" rx="4" fill="#3b82f6" opacity="0.15"></rect>
                <circle cx="80" cy="40" r="14" fill="#f59e0b" opacity="0.9"></circle>
                <polygon points="77,34 87,40 77,46" fill="white"></polygon>
              </svg>
            </div>

            <div class="illustration-person">
              <svg viewBox="0 0 340 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="240" width="300" height="6" rx="3" fill="#1e293b"></rect>
                <rect x="100" y="190" width="140" height="52" rx="6" fill="#2563EB"></rect>
                <rect x="108" y="196" width="124" height="38" rx="4" fill="#1d4ed8"></rect>
                <ellipse cx="170" cy="230" rx="10" ry="4" fill="#e2e8f0" opacity="0.4"></ellipse>
                <rect x="112" y="200" width="116" height="30" rx="3" fill="#eff6ff" opacity="0.15"></rect>
                <ellipse cx="170" cy="130" rx="26" ry="26" fill="#fbbf24"></ellipse>
                <ellipse cx="170" cy="112" rx="22" ry="16" fill="#1e293b"></ellipse>
                <rect x="148" y="104" width="44" height="12" rx="6" fill="#1e293b"></rect>
                <path d="M130 240 C130 190 144 178 170 174 C196 178 210 190 210 240Z" fill="#2563EB"></path>
                <path d="M144 195 C135 205 128 215 120 220" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"></path>
                <path d="M196 195 C205 205 212 215 220 220" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"></path>
                <rect x="218" y="222" width="22" height="18" rx="4" fill="#475569"></rect>
                <path d="M240 226 Q248 226 248 234 Q248 242 240 242" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"></path>
                <rect x="221" y="216" width="16" height="6" rx="2" fill="#94a3b8" opacity="0.5"></rect>
                <rect x="0" y="246" width="340" height="2" rx="1" fill="#cbd5e1"></rect>
              </svg>
            </div>

            <div class="float-dots">
              <svg viewBox="0 0 80 20" fill="none">
                <circle cx="10" cy="10" r="4" fill="#7C83FD"></circle>
                <circle cx="26" cy="10" r="4" fill="#7C83FD" opacity="0.7"></circle>
                <circle cx="42" cy="10" r="4" fill="#7C83FD" opacity="0.4"></circle>
                <circle cx="58" cy="10" r="4" fill="#7C83FD" opacity="0.2"></circle>
              </svg>
            </div>
          </div>
        </section>

        <section class="login-card" aria-labelledby="login-title">
          <p class="login-card__welcome">Welcome back!</p>
          <h1 id="login-title" class="login-card__title">Balance Score Card Portal</h1>
          <div class="login-card__divider"></div>

          <form id="login-form" class="login-form">
            <label class="login-form__field">
              <span>Username/mail id</span>
              <input id="username" name="username" type="text" autocomplete="username" />
            </label>

            <label class="login-form__field">
              <span>Password</span>
              <input id="password" name="password" type="password" autocomplete="current-password" />
            </label>

            <button class="login-form__button login-form__button--dealer" type="submit" data-role="dealer">
              Dealer Login
            </button>

            <div class="login-form__or">OR</div>

            <button class="login-form__button login-form__button--msil" type="submit" data-role="msil">
              MSIL Login
            </button>

            <button class="login-form__admin" type="submit" data-role="admin">
              Admin Login
            </button>
          </form>
        </section>
      </main>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="./auth/login.js"></script>
  </body>
</html>

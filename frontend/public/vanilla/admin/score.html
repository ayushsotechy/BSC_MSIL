<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BSC Score | BSC Portal</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./score.css" />
  </head>
  <body>
    <div class="dashboard-page">
      <nav class="app-navbar dashboard-navbar">
        <div class="app-navbar__brand" aria-label="Maruti Suzuki">
          <img class="app-navbar__brand-mark" src="../assets/maruti-logoo.png" alt="Maruti Suzuki" />
        </div>
        <div class="app-navbar__right">
          <img class="app-navbar__powered-logo" src="../assets/Powered_By_DE_black.png" alt="Powered by DE" />
          <button class="app-navbar__icon-btn" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <button class="app-navbar__icon-btn" type="button" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="5" r="1" fill="currentColor"></circle>
              <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
              <circle cx="12" cy="19" r="1" fill="currentColor"></circle>
            </svg>
          </button>
          <button id="logout-button" class="app-navbar__user app-navbar__user--button" type="button" title="Click to logout">
            <span class="app-navbar__avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"></path>
              </svg>
            </span>
            <span class="app-navbar__user-info">
              <span id="navbar-user-name" class="app-navbar__user-name">Admin</span>
              <span id="navbar-user-code" class="app-navbar__user-code">ADMIN</span>
            </span>
          </button>
        </div>
      </nav>

      <div class="dashboard-shell">
        <aside class="dashboard-sidebar" aria-label="Admin navigation">
          <button class="sidebar-item sidebar-item--active" type="button">
            <span class="sidebar-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.14 1.14"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.14-1.14"></path>
              </svg>
            </span>
            <span>View BSC</span>
          </button>
          <button class="sidebar-item" type="button" data-placeholder>
            <span class="sidebar-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h3l3-9 4 18 3-9h5"></path>
                <path d="M7 20h10"></path>
              </svg>
            </span>
            <span>View NSC</span>
          </button>
          <button class="sidebar-item" type="button" data-placeholder>
            <span class="sidebar-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M7 9h6"></path>
                <path d="M7 13h10"></path>
                <path d="M16 9h1"></path>
              </svg>
            </span>
            <span>Access Credentials</span>
          </button>
          <button class="sidebar-item" type="button" data-placeholder>
            <span class="sidebar-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 19 6v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-3Z"></path>
                <path d="m9 12 2 2 4-5"></path>
              </svg>
            </span>
            <span>Access Control</span>
          </button>
          <button id="back-button" class="sidebar-back" type="button">
            <span class="sidebar-back__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
              </svg>
            </span>
            <span>Back</span>
          </button>
        </aside>

        <main class="dashboard-main score-main">
          <header class="score-header">
            <h1 id="score-page-title">View BSC Score page</h1>
            <div class="score-actions">
              <button id="score-sheet-button" class="dashboard-btn dashboard-btn--download" type="button">Score Sheet</button>
              <button id="review-sheet-button" class="dashboard-btn dashboard-btn--review" type="button">Review Sheet</button>
              <button id="edit-button" class="dashboard-btn dashboard-btn--edit" type="button">Edit</button>
            </div>
          </header>

          <section id="score-loading" class="table-state">Loading score sheet...</section>
          <section id="score-content" class="score-content" hidden></section>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="./score.js"></script>
  </body>
</html>
